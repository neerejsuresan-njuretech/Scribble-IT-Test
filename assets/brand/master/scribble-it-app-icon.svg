<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SCRIBBLE-IT Application Icon">
  <title>SCRIBBLE-IT Application Icon</title>
  <defs>
    <linearGradient id="tile-bg" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132D56" />
      <stop offset="45%" stop-color="#0B1F3B" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <radialGradient id="tile-glow" cx="76%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="48%" stop-color="#0A84FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0B1F3B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tile-rim" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#0A84FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    
    <linearGradient id="app-icon-doc-stroke" x1="210" y1="128" x2="814" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="48%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="app-icon-s-grad" x1="330" y1="300" x2="690" y2="755" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="55%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#60B5FF" />
    </linearGradient>
    <linearGradient id="app-icon-pencil-body" x1="590" y1="260" x2="770" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>
    <linearGradient id="app-icon-doc-fill" x1="216" y1="132" x2="808" y2="892" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14335E" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#0B1F3B" stop-opacity="0.88" />
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#tile-bg)" />
         <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#tile-glow)" />
         <rect x="30" y="30" width="964" height="964" rx="218" fill="none" stroke="url(#tile-rim)" stroke-width="12" />
  <g transform="translate(112.6 112.6) scale(0.78)">
    
    <g id="app-icon-layer-document">
      <!-- Enterprise Document / Page Outline with Folded Top-Right Corner -->
      <path
        d="M 284 140
           H 606
           L 796 330
           V 816
           A 68 68 0 0 1 728 884
           H 284
           A 68 68 0 0 1 216 816
           V 208
           A 68 68 0 0 1 284 140 Z"
        fill="url(#app-icon-doc-fill)"
        stroke="url(#app-icon-doc-stroke)"
        stroke-width="42"
        stroke-linejoin="round"
      />
      <!-- Crisp Folded Corner Crease -->
      <path
        d="M 606 140 V 286 A 44 44 0 0 0 650 330 H 796"
        fill="#183C6E"
        fill-opacity="0.45"
        stroke="url(#app-icon-doc-stroke)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Minimal Document Reference Lines (top-left) -->
      <line x1="304" y1="248" x2="496" y2="248" stroke="url(#app-icon-doc-stroke)" stroke-width="26" stroke-linecap="round" opacity="0.55" />
      <line x1="304" y1="308" x2="432" y2="308" stroke="url(#app-icon-doc-stroke)" stroke-width="22" stroke-linecap="round" opacity="0.4" />
    </g>

    <g id="app-icon-layer-s-pencil">
      <!-- Stylized Geometric 'S' Monogram Sweeping Through the Document -->
      <path
        d="M 594 416
           C 562 366, 488 352, 424 374
           C 356 398, 338 468, 384 514
           C 424 554, 520 554, 570 594
           C 626 640, 610 730, 534 762
           C 462 792, 376 774, 336 724"
        fill="none"
        stroke="url(#app-icon-s-grad)"
        stroke-width="64"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Integrated Precision Diagonal Pencil Writing Into the S Curve -->
      <g transform="translate(650 470) rotate(38)">
        <!-- Pencil Eraser Cap -->
        <rect x="-32" y="-176" width="64" height="44" rx="18" fill="#22D3EE" />
        <!-- Metallic Ferrule Band -->
        <rect x="-32" y="-124" width="64" height="24" rx="6" fill="#F5F8FF" />
        <!-- Pencil Shaft Body -->
        <rect x="-32" y="-92" width="64" height="196" rx="10" fill="url(#app-icon-pencil-body)" />
        <!-- Facet Highlight Along Shaft -->
        <rect x="-10" y="-86" width="16" height="184" rx="6" fill="#FFFFFF" opacity="0.26" />
        <!-- Tapered Wooden/Metallic Tip Cone -->
        <polygon points="-32,110 32,110 0,188" fill="#F5F8FF" />
        <!-- Precision Graphite/Cyan Nib -->
        <polygon points="-13,156 13,156 0,188" fill="#22D3EE" />
      </g>

      <!-- Precision Ink/Scribble Baseline Stroke -->
      <path
        d="M 526 776 C 584 776, 636 764, 694 742"
        fill="none"
        stroke="#22D3EE"
        stroke-width="28"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
