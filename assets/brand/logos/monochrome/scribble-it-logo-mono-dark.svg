<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="SCRIBBLE-IT Primary Logo">
  <title>SCRIBBLE-IT Primary Logo</title>
  <defs>
  </defs>
  
  <g id="layer-symbol" transform="translate(385.0 56) scale(0.42)">
    
    <g id="logo-primary-mono-dark-layer-document">
      <!-- Enterprise Document / Page Outline with Folded Top-Right Corner -->
      <path
        d="M 284 140
           H 606
           L 796 330
           V 816
           A 68 68 0 0 1 728 884
           H 284
           A 68 68 0 0 1 216 816
           V 208
           A 68 68 0 0 1 284 140 Z"
        fill="none"
        stroke="#0B1F3B"
        stroke-width="42"
        stroke-linejoin="round"
      />
      <!-- Crisp Folded Corner Crease -->
      <path
        d="M 606 140 V 286 A 44 44 0 0 0 650 330 H 796"
        fill="none"
        fill-opacity="0"
        stroke="#0B1F3B"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Minimal Document Reference Lines (top-left) -->
      <line x1="304" y1="248" x2="496" y2="248" stroke="#0B1F3B" stroke-width="26" stroke-linecap="round" opacity="0.85" />
      <line x1="304" y1="308" x2="432" y2="308" stroke="#0B1F3B" stroke-width="22" stroke-linecap="round" opacity="0.65" />
    </g>

    <g id="logo-primary-mono-dark-layer-s-pencil">
      <!-- Stylized Geometric 'S' Monogram Sweeping Through the Document -->
      <path
        d="M 594 416
           C 562 366, 488 352, 424 374
           C 356 398, 338 468, 384 514
           C 424 554, 520 554, 570 594
           C 626 640, 610 730, 534 762
           C 462 792, 376 774, 336 724"
        fill="none"
        stroke="#0B1F3B"
        stroke-width="64"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Integrated Precision Diagonal Pencil Writing Into the S Curve -->
      <g transform="translate(650 470) rotate(38)">
        <!-- Pencil Eraser Cap -->
        <rect x="-32" y="-176" width="64" height="44" rx="18" fill="#0B1F3B" />
        <!-- Metallic Ferrule Band -->
        <rect x="-32" y="-124" width="64" height="24" rx="6" fill="#0B1F3B" />
        <!-- Pencil Shaft Body -->
        <rect x="-32" y="-92" width="64" height="196" rx="10" fill="#0B1F3B" />
        <!-- Facet Highlight Along Shaft -->
        <rect x="-10" y="-86" width="16" height="184" rx="6" fill="#F5F8FF" opacity="0.28" />
        <!-- Tapered Wooden/Metallic Tip Cone -->
        <polygon points="-32,110 32,110 0,188" fill="#0B1F3B" />
        <!-- Precision Graphite/Cyan Nib -->
        <polygon points="-13,156 13,156 0,188" fill="#0B1F3B" />
      </g>

      <!-- Precision Ink/Scribble Baseline Stroke -->
      <path
        d="M 526 776 C 584 776, 636 764, 694 742"
        fill="none"
        stroke="#0B1F3B"
        stroke-width="28"
        stroke-linecap="round"
      />
    </g>
  </g>
  <g id="layer-wordmark">
    <text x="600" y="612" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="122" font-weight="800" letter-spacing="-3.2" fill="#0B1F3B">Scribble <tspan fill="#0B1F3B">IT</tspan></text>
  </g>
  <g id="layer-attribution">
    <text x="600" y="676" text-anchor="middle" font-family="Inter, Manrope, sans-serif" font-size="36" font-weight="500" letter-spacing="0.6" fill="#0B1F3B" opacity="0.82">A Njure Tech product.</text>
  </g>
</svg>
