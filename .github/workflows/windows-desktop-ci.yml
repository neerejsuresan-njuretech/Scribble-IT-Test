name: Build & Verify Windows Desktop Application

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'packages/**'
      - 'assets/brand/**'
      - 'tests/frontend/**'
      - 'scripts/build-windows-release.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'packages/**'
      - 'assets/brand/**'
      - 'tests/frontend/**'
      - 'scripts/build-windows-release.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows x86_64 Tauri Build & Install Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 (>=24.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: ">=24.12.0 <25"
          cache: npm

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build, verify, stage, and smoke-test Windows installer
        shell: pwsh
        env:
          VITE_BASE_PATH: "./"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_BACKEND_API: ${{ vars.VITE_USE_BACKEND_API }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-release.ps1 -VerifyInstall -IncludeMsi

      - name: Verify non-empty Windows .exe artifact in release/windows
        shell: pwsh
        run: |
          $exeFiles = @(Get-ChildItem -Path "release/windows" -Filter "*.exe" -File)
          if ($exeFiles.Count -eq 0 -or $exeFiles[0].Length -le 0) {
            throw "Expected non-empty Windows .exe installer in release/windows/."
          }
          Write-Host "Verified artifact: $($exeFiles[0].Name) ($($exeFiles[0].Length) bytes)"
          Get-Content "release/windows/SHA256SUMS.txt"
          Get-Content "release/windows/installation-verification.txt"

      - name: Upload Windows installer release bundle & verification logs (Unsigned CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: scribble-it-windows-x86_64-release
          path: release/windows/**
          retention-days: 30
