name: Build & Verify Windows Desktop Application

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'packages/**'
      - 'assets/brand/**'
      - 'tests/frontend/**'
      - 'scripts/build-windows-release.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'packages/**'
      - 'assets/brand/**'
      - 'tests/frontend/**'
      - 'scripts/build-windows-release.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-desktop:
    name: Windows x86_64 Tauri Build & Install Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 (>=24.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: ">=24.12.0 <25"
          cache: npm

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build, verify, stage, and smoke-test Windows NSIS & MSI installers
        shell: pwsh
        env:
          VITE_BASE_PATH: "./"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_BACKEND_API: ${{ vars.VITE_USE_BACKEND_API }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-release.ps1 -VerifyInstall -IncludeMsi

      - name: Verify non-empty Windows .exe and .msi artifacts and checksums in release/windows
        shell: pwsh
        run: |
          $exeFiles = @(Get-ChildItem -Path "release/windows" -Filter "*.exe" -File)
          if ($exeFiles.Count -eq 0 -or $exeFiles[0].Length -le 0) {
            throw "Expected non-empty Windows .exe installer in release/windows/."
          }
          $msiFiles = @(Get-ChildItem -Path "release/windows" -Filter "*.msi" -File)
          if ($msiFiles.Count -eq 0 -or $msiFiles[0].Length -le 0) {
            throw "Expected non-empty Windows .msi installer in release/windows/."
          }
          if (-not (Test-Path "release/windows/SHA256SUMS.txt")) {
            throw "Expected SHA256SUMS.txt in release/windows/."
          }
          if (-not (Test-Path "release/windows/installation-verification.txt")) {
            throw "Expected installation-verification.txt in release/windows/."
          }
          Write-Host "Verified NSIS artifact: $($exeFiles[0].Name) ($($exeFiles[0].Length) bytes)"
          Write-Host "Verified MSI artifact: $($msiFiles[0].Name) ($($msiFiles[0].Length) bytes)"
          Get-Content "release/windows/SHA256SUMS.txt"
          Get-Content "release/windows/installation-verification.txt"

      - name: Publish verified Windows installers & checksums to GitHub Releases
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [string]$conf.version
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$version" }

          $exe = (Get-ChildItem -Path 'release/windows' -Filter '*.exe' -File | Select-Object -First 1)
          $msi = (Get-ChildItem -Path 'release/windows' -Filter '*.msi' -File | Select-Object -First 1)
          $shaSums = Get-Content 'release/windows/SHA256SUMS.txt' -Raw
          $verifyLog = Get-Content 'release/windows/installation-verification.txt' -Raw

          $exeMb = [Math]::Round($exe.Length / 1MB, 2)
          $msiMb = [Math]::Round($msi.Length / 1MB, 2)

          $notes = @(
            "# SCRIBBLE-IT for Windows v$version"
            ""
            "**Organization:** Njure Tech (formally Njure Group)"
            "**Compatibility:** Windows 10 (1809+) and Windows 11 (x86_64 64-bit)"
            "**Application ID:** ``$($conf.identifier)``"
            ""
            "## Installers & Sizes"
            "- **Primary NSIS Installer (.exe):** ``$($exe.Name)`` ($exeMb MiB / $($exe.Length) bytes)"
            "- **Enterprise WiX Installer (.msi):** ``$($msi.Name)`` ($msiMb MiB / $($msi.Length) bytes)"
            ""
            "## SHA-256 Checksums"
            "``````text"
            $shaSums.TrimEnd()
            "``````"
            ""
            "## Automated Installation & Uninstall Verification"
            "``````text"
            $verifyLog.TrimEnd()
            "``````"
            ""
            "> **Note on Code Signing:** Installers built by CI currently have ``certificateThumbprint: null`` (unsigned). Always verify the downloaded file's SHA-256 hash using ``Get-FileHash .\$($exe.Name) -Algorithm SHA256``."
          ) -join "`n"

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Out-File -FilePath $notesPath -Encoding utf8

          $assets = @(
            $exe.FullName,
            $msi.FullName,
            'release/windows/SHA256SUMS.txt',
            "$($exe.FullName).sha256",
            "$($msi.FullName).sha256",
            'release/windows/BUILD_INFO.txt',
            'release/windows/installation-verification.txt'
          )

          $existing = $null
          try {
            $existing = gh release view $tag --json url 2>$null
          } catch {
            $existing = $null
          }

          if ($existing) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "SCRIBBLE-IT v$version for Windows" --notes-file $notesPath
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "SCRIBBLE-IT v$version for Windows" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed publishing Windows release assets to GitHub Release $tag"
          }

      - name: Upload Windows installer release bundle & verification logs (Unsigned CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: scribble-it-windows-x86_64-release
          path: release/windows/**
          retention-days: 30
