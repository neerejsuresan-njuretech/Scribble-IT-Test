name: Deploy Scribble IT to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows:
      - "Build & Verify Windows Desktop Application"
      - "Build & Verify macOS Desktop Application"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 (>=24.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: ">=24.12.0 <25"

      - name: Install dependencies
        run: npm ci

      - name: Resolve published Windows & macOS GitHub Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "scribble-it-pages-ci"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=15",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:
              print(f"No GitHub release metadata resolved ({exc}); keeping In Development state.")
              releases = []

          def resolve_asset_sha256(asset, assets, sums_candidates):
              digest = str(asset.get("digest") or "")
              m = re.match(r"^sha256:([a-fA-F0-9]{64})$", digest)
              if m:
                  return m.group(1).lower()
              per_file = next((a for a in assets if str(a.get("name", "")) == f"{asset['name']}.sha256"), None)
              targets = [per_file] if per_file else []
              targets.extend(sums_candidates)
              for target in targets:
                  if not target:
                      continue
                  try:
                      sreq = urllib.request.Request(target["browser_download_url"], headers={"User-Agent": "scribble-it-pages-ci"})
                      with urllib.request.urlopen(sreq, timeout=15) as sresp:
                          text = sresp.read().decode("utf-8", errors="replace")
                      for line in text.splitlines():
                          if asset["name"] in line or target is per_file:
                              hm = re.search(r"\b([a-fA-F0-9]{64})\b", line)
                              if hm:
                                  return hm.group(1).lower()
                  except Exception as exc:
                      print(f"Warning: unable to read checksum asset {target.get('name')}: {exc}")
              return ""

          # --- 1. Resolve Windows Release (.exe + .msi) ---
          win_selected = None
          for rel in releases:
              if rel.get("draft"):
                  continue
              assets = rel.get("assets") or []
              exe = next((a for a in assets if str(a.get("name", "")).lower().endswith(".exe") and int(a.get("size", 0)) > 0), None)
              if exe:
                  win_selected = (rel, exe, assets)
                  break

          if win_selected:
              rel, exe, assets = win_selected
              msi = next((a for a in assets if str(a.get("name", "")).lower().endswith(".msi") and int(a.get("size", 0)) > 0), None)
              sums = next((a for a in assets if str(a.get("name", "")) == "SHA256SUMS.txt"), None)
              sha256 = resolve_asset_sha256(exe, assets, [sums])
              if sha256:
                  tag = str(rel.get("tag_name") or "").lstrip("v") or "1.0.0"
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
                      envf.write(f"VITE_WINDOWS_RELEASE_VERSION={tag}\n")
                      envf.write(f"VITE_WINDOWS_INSTALLER_URL={exe['browser_download_url']}\n")
                      envf.write(f"VITE_WINDOWS_INSTALLER_SHA256={sha256}\n")
                      envf.write(f"VITE_WINDOWS_INSTALLER_SIZE_BYTES={exe['size']}\n")
                      envf.write(f"VITE_WINDOWS_RELEASE_URL={rel.get('html_url', '')}\n")
                      if msi:
                          envf.write(f"VITE_WINDOWS_MSI_URL={msi['browser_download_url']}\n")
                          envf.write(f"VITE_WINDOWS_MSI_SIZE_BYTES={msi['size']}\n")
                      if sums:
                          envf.write(f"VITE_WINDOWS_SHA256SUMS_URL={sums['browser_download_url']}\n")
                  print(f"Resolved Windows release v{tag}: {exe['name']} ({exe['size']} bytes), sha256={sha256}")
          else:
              print("No published non-draft Windows .exe GitHub Release found; keeping Windows In Development.")

          # --- 2. Resolve macOS Release (Apple Silicon arm64 .dmg & Intel x64 .dmg) ---
          mac_selected = None
          for rel in releases:
              if rel.get("draft"):
                  continue
              assets = rel.get("assets") or []
              dmgs = [a for a in assets if str(a.get("name", "")).lower().endswith(".dmg") and int(a.get("size", 0)) > 0]
              if dmgs:
                  mac_selected = (rel, dmgs, assets)
                  break

          if mac_selected:
              rel, dmgs, assets = mac_selected
              arm_dmg = next((a for a in dmgs if re.search(r"(arm64|aarch64|silicon)", str(a.get("name", "")), re.I)), None)
              x64_dmg = next((a for a in dmgs if re.search(r"(x64|x86_64|intel)", str(a.get("name", "")), re.I)), None)
              sums = next((a for a in assets if str(a.get("name", "")) in ("SHA256SUMS-macos.txt", "SHA256SUMS.txt")), None)

              arm_sha = resolve_asset_sha256(arm_dmg, assets, [sums]) if arm_dmg else ""
              x64_sha = resolve_asset_sha256(x64_dmg, assets, [sums]) if x64_dmg else ""

              if (arm_dmg and arm_sha) or (x64_dmg and x64_sha):
                  raw_tag = str(rel.get("tag_name") or "")
                  version = re.sub(r"^(macos-)?v", "", raw_tag, flags=re.I) or "1.0.0"
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
                      envf.write(f"VITE_MACOS_RELEASE_VERSION={version}\n")
                      envf.write(f"VITE_MACOS_RELEASE_URL={rel.get('html_url', '')}\n")
                      if arm_dmg and arm_sha:
                          envf.write(f"VITE_MACOS_ARM64_DMG_URL={arm_dmg['browser_download_url']}\n")
                          envf.write(f"VITE_MACOS_ARM64_DMG_SHA256={arm_sha}\n")
                          envf.write(f"VITE_MACOS_ARM64_DMG_SIZE_BYTES={arm_dmg['size']}\n")
                      if x64_dmg and x64_sha:
                          envf.write(f"VITE_MACOS_X64_DMG_URL={x64_dmg['browser_download_url']}\n")
                          envf.write(f"VITE_MACOS_X64_DMG_SHA256={x64_sha}\n")
                          envf.write(f"VITE_MACOS_X64_DMG_SIZE_BYTES={x64_dmg['size']}\n")
                      if sums:
                          envf.write(f"VITE_MACOS_SHA256SUMS_URL={sums['browser_download_url']}\n")
                  print(f"Resolved macOS release v{version}: arm64={bool(arm_dmg and arm_sha)}, x64={bool(x64_dmg and x64_sha)}")
          else:
              print("No published non-draft macOS .dmg GitHub Release found; keeping macOS In Development.")
          PYEOF

      - name: Build static bundle for GitHub Pages
        env:
          # Relative base ('./') works for both username.github.io/repo-name and custom domains with HashRouter
          VITE_BASE_PATH: "./"
          # Optional: Set repository variable VITE_API_BASE_URL if hosting server.ts separately for AI & Twilio routes
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Ensure SPA fallback and .nojekyll in dist
        run: |
          touch dist/.nojekyll
          if [ ! -f dist/404.html ]; then cp dist/index.html dist/404.html; fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
