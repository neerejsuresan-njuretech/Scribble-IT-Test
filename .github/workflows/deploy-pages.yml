name: Deploy Scribble IT to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static bundle for GitHub Pages
        env:
          # Relative base ('./') works for both username.github.io/repo-name and custom domains with HashRouter
          VITE_BASE_PATH: "./"
          # Optional: Set repository variable VITE_API_BASE_URL if hosting server.ts separately for AI & Twilio routes
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Ensure SPA fallback and .nojekyll in dist
        run: |
          touch dist/.nojekyll
          if [ ! -f dist/404.html ]; then cp dist/index.html dist/404.html; fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
