<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scribble IT — Enterprise ITSM</title>
    <meta name="description" content="Minimal dot-matrix IT Service Management suite by Njure Tech featuring Incidents, Service Requests, Problems, Changes, CMDB, Inventory, Telephony integration, Self-Service, and Payments." />
    <meta property="og:title" content="Scribble IT — Enterprise ITSM" />
    <meta property="og:description" content="Minimal dot-matrix IT Service Management suite by Njure Tech featuring Incidents, Service Requests, Problems, Changes, CMDB, Inventory, Telephony integration, Self-Service, and Payments." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('SCRIBBLE_ITSM_DB_V5_ENTERPRISE_THEME') ||
            localStorage.getItem('SCRIBBLE_ITSM_DB_V4_BLANK_THEME');
          var mode = saved && JSON.parse(saved) === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(mode);
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-rose-600 selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
