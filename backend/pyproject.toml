[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scribble-it-backend"
version = "2.0.0-alpha.1"
description = "Scribble-IT 2.0 Enterprise Multi-Tenant ITSM Backend API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests requiring live PostgreSQL and Redis services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
