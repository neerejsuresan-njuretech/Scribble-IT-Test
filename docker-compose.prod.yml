# Production override for Scribble-IT 2.0 (Self-Hosted & Cloud VM Deployment)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile web up -d

services:
  postgres:
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

  redis:
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      ENABLE_OPENAPI_DOCS: "false"
      LOG_JSON: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set strong >=32 char JWT_SECRET_KEY in .env}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set strong >=32 char INTEGRATION_ENCRYPTION_KEY in .env}
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${UVICORN_WORKERS:-4}",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  worker:
    environment:
      APP_ENV: production
      LOG_JSON: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set strong >=32 char JWT_SECRET_KEY in .env}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set strong >=32 char INTEGRATION_ENCRYPTION_KEY in .env}
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

  web:
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
