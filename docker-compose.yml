services:
  postgres:
    image: postgres:16-alpine
    container_name: scribble-it-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scribble_it}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-scribble_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-scribble_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres_bootstrap} -d ${POSTGRES_DB:-scribble_it}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: scribble-it-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scribble-it-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-scribble_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribble_it}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_MIGRATOR_USER:-scribble_migrator}:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribble_it}
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scribble-it-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-scribble_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribble_it}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_MIGRATOR_USER:-scribble_migrator}:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribble_it}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-before-staging-or-production-32chars}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-dev-only-integration-encryption-key-32chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      AI_DAILY_ORG_LIMIT: ${AI_DAILY_ORG_LIMIT:-500}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      UPLOAD_STORAGE_DIR: /var/lib/scribble-it/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TELEPHONY_WEBHOOK_SECRET: ${TELEPHONY_WEBHOOK_SECRET:-}
      ENABLE_OPENAPI_DOCS: ${ENABLE_OPENAPI_DOCS:-true}
    volumes:
      - uploads_data:/var/lib/scribble-it/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scribble-it-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-scribble_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribble_it}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_MIGRATOR_USER:-scribble_migrator}:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-scribble_it}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-before-staging-or-production-32chars}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-dev-only-integration-encryption-key-32chars}
    command: ["python", "-m", "app.workers.runner"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: scribble-it-web
    restart: unless-stopped
    profiles: ["web", "proxy"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
